# pnpm v11 起，除 registry / 鉴权之外的所有配置都集中在本文件：
# - package.json 的 pnpm 字段不再被读取（overrides、patchedDependencies 已迁移到这里）
# - onlyBuiltDependencies / ignoredBuiltDependencies 等已被移除，统一用 allowBuilds 映射
#   参考 https://pnpm.io/11.x/migration

# 是否允许依赖执行安装脚本（true 允许 / false 明确禁止）
allowBuilds:
  # 需要 postinstall 校验并链接平台原生二进制
  esbuild: true
  # preinstall 只是 echo，prepare 对 registry 包不会执行，无需构建
  '@google/genai': false
  # postinstall 仅服务于其 CLI，作为库使用不需要
  protobufjs: false

# 依赖版本覆盖（原 package.json#pnpm.overrides）
overrides:
  'js-beautify@1.15.4>glob': '^13.0.6'
  # '-' 表示移除该依赖
  'fetch-blob@3.2.0>node-domexception': '-'

# 依赖补丁（原 package.json#pnpm.patchedDependencies）
patchedDependencies:
  'fetch-blob@3.2.0': patches/fetch-blob@3.2.0.patch
